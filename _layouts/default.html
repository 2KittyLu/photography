<!DOCTYPE HTML>
<html>
	<head>
		{% include head.html %}
	</head>

	<body>

		{{ content }}

		{% include footer.html %}

		<script>
			// Disable right-click on images
			document.addEventListener('contextmenu', function(e) {
				if (e.target.tagName === 'IMG') {
					e.preventDefault();
				}
			});

			// Disable dragging images
			document.addEventListener('dragstart', function(e) {
				if (e.target.tagName === 'IMG') {
					e.preventDefault();
				}
			});
		</script>

	</body>
</html>
